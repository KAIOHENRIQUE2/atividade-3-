<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Formulário</title>
  <link rel="stylesheet" href="formulario.css">
</head>
<body>

  <div class="index">
    <h1 id="titulo">Formulário de Cadastro Para Voluntários</h1>

    <div class="html">
      <p>Participe como voluntário nos nossos eventos de futebol! Preencha seus dados abaixo:</p>
    </div>

    <form action="processar.php" method="post">
      
      <fieldset>
        <legend>Informações Pessoais</legend>
        
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="1" max="120"><br><br>
      </fieldset>

      <fieldset>
        <legend>Gênero</legend>

        <input type="radio" id="masculino" name="genero" value="masculino" required>
        <label for="masculino">Masculino</label><br>

        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label><br>

        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label>
      </fieldset>

      <fieldset>
        <legend>Preferências</legend>

        <input type="checkbox" id="noticias" name="preferencias[]" value="noticias" required>
        <label for="noticias">Receber Notícias</label><br>

        <input type="checkbox" id="promocoes" name="preferencias[]" value="promocoes">
        <label for="promocoes">Receber Promoções</label><br>

        <input type="checkbox" id="novidades" name="preferencias[]" value="novidades">
        <label for="novidades">Receber Novidades</label><br>
      </fieldset>

      <fieldset>
        <legend>Informações de Contato</legend>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone"><br><br>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco"><br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade"><br><br>
      </fieldset>

      <fieldset>
        <legend>Outras Informações</legend>

        <label for="nacionalidade">Nacionalidade:</label>
        <select id="nacionalidade" name="nacionalidade" required>
          <option value="">Selecione</option>
          <option value="brasileiro">Brasileiro</option>
          <option value="estrangeiro">Estrangeiro</option>
        </select><br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" rows="4" cols="50"></textarea>
      </fieldset>

      <br>
      <input type="reset" value="Limpar">
      <input type="submit" value="Enviar">
    </form>
  </div>

</body>
</html>
